name: Deploy iOS to iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ios-iphone
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, receipt-divider-ios]
    timeout-minutes: 30
    env:
      IPHONE_ID: ${{ vars.IOS_DEVICES || 'all' }}
      IOS_SIGNING_CONFIG: ${{ vars.IOS_SIGNING_CONFIG }}
      LAUNCH_APP: ${{ vars.IOS_LAUNCH_APP || 'false' }}
    steps:
      # A run that waited while the Mac was asleep may be behind main by now; the run for the newest commit
      # installs everything, so this one stops instead of building an outdated app.
      - name: Skip if main has moved on
        id: latest
        shell: bash
        run: |
          latest="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)"
          if [[ -n "$latest" && "$latest" != "$GITHUB_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: main is now at ${latest:0:7}, which will be installed instead."
          fi
      - if: steps.latest.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and install
        if: steps.latest.outputs.skip != 'true'
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          caffeinate -i bash apps/ios/scripts/deploy-to-iphone.sh
