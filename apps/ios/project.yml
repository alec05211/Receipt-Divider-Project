name: ReceiptDivider
options:
  bundleIdPrefix: com.receiptdivider
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.2
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  ReceiptDivider:
    type: application
    platform: iOS
    sources:
      - path: ReceiptDivider
    dependencies:
      - package: Supabase
    info:
      path: ReceiptDivider/Info.plist
      properties:
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        API_BASE_URL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.receiptdivider.app.auth
            CFBundleURLSchemes: [receiptdivider]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptdivider.app
        PRODUCT_NAME: Receipt Divider
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Receipt Divider
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a receipt photo to review and split with your group.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a receipt to review and split with your group.
        SUPABASE_URL: https://lurdfvsnscylvwvvepos.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_ooNI0Eex792fD6MGp6XX_g_QofO07OY
        API_BASE_URL: https://lurdfvsnscylvwvvepos.supabase.co/functions/v1/ledger-api
  ReceiptDividerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReceiptDividerTests
    dependencies:
      - target: ReceiptDivider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptdivider.tests
